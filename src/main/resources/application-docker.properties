spring.application.name=auth-service
server.port=8082

spring.datasource.url=jdbc:mysql://db:3306/auth_db
spring.datasource.username=authapp_user
spring.datasource.password=authpass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

auth.seed.enabled=${AUTH_SEED_ENABLED:false}
auth.seed.admin.username=${AUTH_SEED_ADMIN_USERNAME:admin}
auth.seed.admin.password=${AUTH_SEED_ADMIN_PASSWORD:admin}

# Keycloak Admin Configuration (for creating users)
keycloak.auth-server-url=http://keycloak:8080
keycloak.realm=patient-journal
keycloak.admin.client-id=patient-journal-backend
keycloak.admin.client-secret=backend-secret-key-123

# OAuth2 Resource Server Configuration (for validating tokens)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/patient-journal
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/patient-journal/protocol/openid-connect/certs