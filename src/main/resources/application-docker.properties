spring.application.name=auth-service
server.port=${PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:authapp_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:authpass}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

auth.seed.enabled=${AUTH_SEED_ENABLED:false}
auth.seed.admin.username=${AUTH_SEED_ADMIN_USERNAME:admin}
auth.seed.admin.password=${AUTH_SEED_ADMIN_PASSWORD:admin}

journal.service.base-url=${JOURNAL_SERVICE_BASE_URL:http://journal-service:8081}

keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080}
keycloak.realm=${KEYCLOAK_REALM:patient-journal}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:patient-journal-backend}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:backend-secret-key-123}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:${keycloak.auth-server-url}/realms/${keycloak.realm}}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost}
